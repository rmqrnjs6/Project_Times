name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  ui-note-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ui_note_idempotency.test.cjs
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t project-times-analysis .
      - run: docker build -t project-times-web ./web
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral test credentials without logging them
        run: |
          cp .env.example .env
          printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> .env
          printf 'BOOTSTRAP_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> .env
      - run: docker compose up -d --build
      - name: Wait for web and dependencies
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail http://127.0.0.1:18080/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Authenticated integration checks
        run: |
          set -a
          . ./.env
          set +a
          export TEST_LOGIN_PASSWORD="$BOOTSTRAP_PASSWORD"
          docker compose exec -T -e TEST_LOGIN_PASSWORD analysis python - < scripts/integration_check.py
      - if: always()
        run: docker compose down

  task-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: task_test
          POSTGRES_USER: task_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_test -d task_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: web/pom.xml
      - name: PostgreSQL transaction and concurrency checks
        working-directory: web
        env:
          TASK_TEST_DB_URL: jdbc:postgresql://localhost:5432/task_test
          TASK_TEST_DB_USER: task_test
          TASK_TEST_DB_PASSWORD: synthetic-ci-only
        run: mvn -B -ntp -Dtest=TaskStoreTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-database-test-results
          path: web/target/surefire-reports/
