name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t project-times-analysis .
      - run: docker build -t project-times-web ./web
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for web and dependencies
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail http://127.0.0.1:18080/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: docker compose exec -T analysis python - < scripts/integration_check.py
      - if: always()
        run: docker compose down
