name: project-times
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: project_times
      POSTGRES_USER: project_times
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - times-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U project_times -d project_times"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
  analysis:
    build: .
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build: ./web
    ports: ["127.0.0.1:${WEB_PORT:-18080}:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/project_times?connectTimeout=3&socketTimeout=5
      DB_USER: project_times
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ANALYSIS_URL: http://analysis:8000
    depends_on:
      db: {condition: service_healthy}
      analysis: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2
volumes:
  times-data:
