spring.application.name=Project Times
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/project_times?connectTimeout=3&socketTimeout=5}
spring.datasource.username=${DB_USER:project_times}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none
server.tomcat.max-http-form-post-size=4KB
server.tomcat.max-parameter-count=5
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.servlet.multipart.enabled=false
spring.jackson.parser.strict-duplicate-detection=true
app.bootstrap.username=${BOOTSTRAP_USERNAME:owner}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
app.external.allowed-hosts=${EXTERNAL_ALLOWED_HOSTS:}

# Deployment address uses Spring configuration; ANALYSIS_URL remains compatible.
app.analysis.base-url=${ANALYSIS_URL:http://analysis:8000}
